function joinQueue(name, key) {
  const q = queues[name];
  if (q.includes(key)) return q.indexOf(key);
  if (q.length >= QUEUE_SPOTS[name].length) return -1;  // full
  q.push(key);
  return q.length - 1;
}

function leaveQueue(name, key) {
  const q = queues[name];
  const i = q.indexOf(key);
  if (i !== -1) q.splice(i, 1);  // everyone behind shifts forward by index
}

function leaveAllQueues(key) {
  leaveQueue('coffee', key);
  leaveQueue('sofa', key);
}

function queueSlotPos(name, key) {
  const i = queues[name].indexOf(key);
  return i === -1 ? null : QUEUE_SPOTS[name][i];
}

function isInsideObstacle(x, y, pad = 10) {
  return NAV_OBSTACLES.some(o =>
    x >= o.x - pad && x <= o.x + o.w + pad &&
    y >= o.y - pad && y <= o.y + o.h + pad
  );
}

function pathBlocked(x1, y1, x2, y2, steps = 8) {
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (isInsideObstacle(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, 8)) return true;
  }
  return false;
}

function getWaypoint(from, to) {
  for (const obs of NAV_OBSTACLES) {
    if (!pathBlocked(from.x, from.y, to.x, to.y)) continue;
    const pad = 18;
    const corners = [
      { x: obs.x - pad, y: obs.y - pad },
      { x: obs.x + obs.w + pad, y: obs.y - pad },
      { x: obs.x - pad, y: obs.y + obs.h + pad },
      { x: obs.x + obs.w + pad, y: obs.y + obs.h + pad },
    ];
    corners.sort((a, b) =>
      Math.hypot(a.x - from.x, a.y - from.y) -
      Math.hypot(b.x - from.x, b.y - from.y)
    );
    return corners[0];
  }
  return null;
}

function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function glow(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function drawText(str, x, y, opts = {}) {
  ctx.save();
  ctx.font = `${opts.weight || 'normal'} ${opts.size || 13}px ${"'Leelawadee UI','Tahoma',sans-serif"}`;
  ctx.fillStyle = opts.color || C.white;
  ctx.textAlign = opts.align || 'center';
  ctx.textBaseline = opts.baseline || 'middle';
  if (opts.shadow) {
    ctx.shadowColor = opts.shadow;
    ctx.shadowBlur = opts.shadowBlur || 8;
  }
  ctx.fillText(str, x, y);
  ctx.restore();
}

function shadow(x, y, w, h) {
  ctx.save();
  ctx.globalAlpha = 0.4;
  rect(x + 3, y + 3, w, h, '#000');
  ctx.restore();
}

  rect(x, y, 4, h, 'rgba(255,255,255,0.09)');
}

function drawHeader() {

  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, HEADER_H - 2);
  const hx = W / 2 - 130, hy = HEADER_H / 2;
  ctx.fillStyle = C.gold;
  ctx.beginPath();
  ctx.moveTo(hx, hy - 10); ctx.lineTo(hx - 9, hy); ctx.lineTo(hx + 9, hy);
  ctx.closePath(); ctx.fill();
  rect(hx - 6, hy, 12, 8, C.gold);
  rect(hx - 2, hy + 3, 4, 5, C.brand);
  drawText('ส. ขอนแก่น AI Office', W / 2, HEADER_H / 2, {
    size: 18, weight: 'bold', color: C.white, shadow: C.gold, shadowBlur: 10,
  });

function drawAllRooms() {
  for (const r of Object.values(ROOMS)) {
    rect(r.x, r.y, r.w, r.h, r.floor);
  }
  ctx.strokeStyle = C.wallOuter;
  ctx.lineWidth = WALL;
  ctx.strokeRect(WALL / 2, HEADER_H + WALL / 2, W - WALL, 520 - WALL);

  const vx = ROOM_W;
  const vDoor1Y = HEADER_H + ROOM_H / 2;
  const vDoor2Y = HEADER_H + ROOM_H + ROOM_H / 2;
  ctx.fillStyle = C.wallOuter;
  rect(vx - WALL / 2, HEADER_H, WALL, vDoor1Y - DOOR_W / 2 - HEADER_H);
  rect(vx - WALL / 2, vDoor1Y + DOOR_W / 2, WALL, vDoor2Y - DOOR_W / 2 - vDoor1Y - DOOR_W / 2);
  rect(vx - WALL / 2, vDoor2Y + DOOR_W / 2, WALL, HEADER_H + 520 - vDoor2Y - DOOR_W / 2);

  const hy2 = HEADER_H + ROOM_H;
  const hDoor1X = ROOM_W / 2;
  const hDoor2X = ROOM_W + ROOM_W / 2;
  ctx.fillStyle = C.wallOuter;
  rect(0, hy2 - WALL / 2, hDoor1X - DOOR_W / 2, WALL);
  rect(hDoor1X + DOOR_W / 2, hy2 - WALL / 2, hDoor2X - DOOR_W / 2 - hDoor1X - DOOR_W / 2, WALL);
  rect(hDoor2X + DOOR_W / 2, hy2 - WALL / 2, W - hDoor2X - DOOR_W / 2, WALL);

  ctx.strokeStyle = C.wallHighlight;
  ctx.lineWidth = 1;
  ctx.strokeRect(WALL, HEADER_H + WALL, W - WALL * 2, 520 - WALL * 2);

  for (const r of Object.values(ROOMS)) {
    ctx.save();
    ctx.globalAlpha = 0.35;
    drawText(r.label, r.x + r.w / 2, r.y + 18, { size: 10, color: C.white, align: 'center' });
    ctx.restore();
  }
}

// Darken/lighten a #rrggbb hex by a factor (clamped to 0..255).
function shadeHex(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.round(((n >> 16) & 255) * f));
  const g = Math.min(255, Math.round(((n >> 8) & 255) * f));
  const b = Math.min(255, Math.round((n & 255) * f));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function drawSprite(grid, cx, cy, bodyColor, facingLeft = false, hairColor = null, scale = S) {
  const hair = hairColor || C.hair;
  const colorMap = {
    's': C.skin, 'h': hair, 'b': bodyColor,
    'l': C.leg,  'w': C.white, 'c': C.crown, 'e': '#2d1b00',
    'z': C.shoe,
    'd': shadeHex(C.skin, 0.88),     // skin shadow
    'm': '#b56b5a',                  // mouth
    'g': '#1a1a1a',                  // glasses / dark detail
    'H': shadeHex(hair, 0.72),       // hair shadow
    'k': shadeHex(bodyColor, 0.74),  // body shadow
    'B': shadeHex(bodyColor, 1.18),  // body highlight
  };
  const cols = grid[0].length;
  const rows = grid.length;
  const sprW = cols * scale;

  ctx.save();
  if (facingLeft) {
    ctx.translate(cx + sprW, cy);
    ctx.scale(-1, 1);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const ch = grid[r][c];
        if (ch === '.') continue;
        ctx.fillStyle = colorMap[ch] || '#ff00ff';
        ctx.fillRect(c * scale, r * scale, scale, scale);
      }
    }
  } else {
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const ch = grid[r][c];
        if (ch === '.') continue;
        ctx.fillStyle = colorMap[ch] || '#ff00ff';
        ctx.fillRect(cx + c * scale, cy + r * scale, scale, scale);
      }
    }
  }
  ctx.restore();
}

const _agentKeyCache = new Map();
function _agentKey(ag) {
  if (_agentKeyCache.has(ag)) return _agentKeyCache.get(ag);
  for (const [k, v] of Object.entries(agents)) {
    if (v === ag) { _agentKeyCache.set(ag, k); return k; }
  }
  return null;
}

// ============================================================
// MOVEMENT HELPERS
// ============================================================
function distTo(agent, target) {
  return Math.hypot(agent.pos.x - target.x, agent.pos.y - target.y);
}

function moveToward(agent, target, dt) {
  agent._lastDY = target.y - agent.pos.y;
  const goal = agent._waypoint || target;
  const dx = goal.x - agent.pos.x;
  const dy = goal.y - agent.pos.y;
  const d = Math.hypot(dx, dy);
  if (d < 4) {
    if (agent._waypoint) { agent._waypoint = null; return false; }
    return true;
  }
  const step = agent.speed * dt / 1000;
  agent.pos.x += (dx / d) * Math.min(step, d);
  agent.pos.y += (dy / d) * Math.min(step, d);
  agent.facingLeft = dx < 0;
  return false;
}

// ============================================================
// BUBBLE DRAWING
// ============================================================
function drawBubble(agent, text_, isTask) {
  const bx = agent.pos.x;
  const by = agent.pos.y - (agent._sprH || 20 * S) - 14;
  ctx.save();
  ctx.font = '12px "Leelawadee UI","Tahoma",sans-serif';
  const measured = ctx.measureText(text_).width;
  const tw = Math.min(measured + 16, 170);
  const th = 22;
  const bx0 = bx - tw / 2;
  const by0 = by - th / 2;

  // Bubble background
  ctx.fillStyle = isTask ? 'rgba(30,30,60,0.92)' : 'rgba(45,53,97,0.92)';
  ctx.strokeStyle = isTask ? C.amber : C.purple;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(bx0, by0, tw, th, 5);
  ctx.fill();
  ctx.stroke();

  // Tail
  ctx.beginPath();
  ctx.moveTo(bx - 5, by0 + th);
  ctx.lineTo(bx, by0 + th + 7);
  ctx.lineTo(bx + 5, by0 + th);
  ctx.closePath();
  ctx.fillStyle = isTask ? 'rgba(30,30,60,0.92)' : 'rgba(45,53,97,0.92)';
  ctx.fill();

  // Text
  ctx.fillStyle = C.white;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const display = text_.length > 22 ? text_.slice(0, 21) + '…' : text_;
  ctx.fillText(display, bx, by);
  ctx.restore();
}

function drawAgent(agent) {
  // Seated = working, or in a flow phase past the walk to the desk.
  // While walking_desk the agent should still face its travel direction and animate.
  const seated =
    agent.state === 'working' ||
    agent.state === 'desk_linger' ||
    (agent.state === 'writer_flow'   && agent._wPhase && agent._wPhase !== 'walking_desk') ||
    (agent.state === 'jamesmie_flow' && agent._jPhase && agent._jPhase !== 'walking_desk');

  let facing = (agent._lastDY < 0) ? 'up' : 'down';
  if (seated) facing = 'down';
  const spr = agent.sprites[facing];

  let grid;
  if (agent.state === 'idle_chill' || agent.state === 'idle_phone' || seated) {
    grid = spr.stand;
  } else {
    const wf = [spr.stand, spr.walk1, spr.stand, spr.walk2];
    grid = wf[agent.frameIdx];
  }

  // Dimensions come from the chosen grid + per-sprite scale, so sprites of
  // different resolutions (e.g. high-res 24-wide at scale 2) render correctly.
  const sc = agent.spriteScale || S;
  const sprW = grid[0].length * sc;
  const sprH = grid.length * sc;
  agent._sprH = sprH;
  const x = Math.round(agent.pos.x - sprW / 2);
  const y = Math.round(agent.pos.y - sprH);

  drawSprite(grid, x, y, agent.color, agent.facingLeft, agent.hairColor, sc);

  const labelFont = '11px "Leelawadee UI","Tahoma",sans-serif';
  ctx.font = labelFont;
  const nameW = ctx.measureText(agent.name).width;
  drawText(agent.name, agent.pos.x, y - 8, {
    size: 11, color: C.white, align: 'center', shadow: '#000', shadowBlur: 4,
  });
  ctx.save();
  ctx.fillStyle = agent.color;
  ctx.beginPath();
  ctx.arc(agent.pos.x - nameW / 2 - 8, y - 8, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  if (agent.taskLabel)  drawBubble(agent, agent.taskLabel, true);
  if (agent.speechText) drawBubble(agent, agent.speechText, false);
}

// ============================================================
// GAME LOOP
// ============================================================
let _lastTs = 0;

// ============================================================
// IDLE STATE MACHINE HELPERS
// ============================================================
const CHAT_PHRASES = [
  'deploy แล้วหรือยัง?', 'วันนี้ busy มาก', 'กาแฟหมดแล้ว',
  'bug อีกแล้ว...', 'เดี๋ยว PR นะ', 'lunch กันไหม?',
  'review code ด้วยนะ', 'tests ผ่านแล้ว!',
];

function _pickIdleState() {
  const r = Math.random();
  if (r < 0.40) return 'idle_wander';
  if (r < 0.60) return 'idle_phone';
  if (r < 0.80) return 'idle_coffee';
  return 'idle_chill';
}

let _chatCheckTimer = 0;

function _checkChat() {
  const idleList = Object.values(agents).filter(ag =>
    ag !== agents.jamesmie &&
    ag.state.startsWith('idle') &&
    ag.state !== 'idle_chat' &&
    ag.state !== 'idle_chat_walk'
  );
  for (let i = 0; i < idleList.length; i++) {
    for (let j = i + 1; j < idleList.length; j++) {
      const a = idleList[i], b = idleList[j];
      if (Math.hypot(a.pos.x - b.pos.x, a.pos.y - b.pos.y) < 80 && Math.random() < 0.30) {
        const phrase = CHAT_PHRASES[Math.floor(Math.random() * CHAT_PHRASES.length)];
        const midX = (a.pos.x + b.pos.x) / 2;
        const midY = (a.pos.y + b.pos.y) / 2;
        a.state = 'idle_chat_walk'; a.targetPos = { x: midX - 24, y: midY };
        a._chatPhrase = phrase; a._chatMidX = midX; a.speechText = '';
        b.state = 'idle_chat_walk'; b.targetPos = { x: midX + 24, y: midY };
        b._chatPhrase = '😄'; b._chatMidX = midX; b.speechText = '';
      }
    }
  }
}

// ============================================================
// JAMESMIE TRIGGER FLOW
// ============================================================
let _lastJamesmieTs = 0;

function triggerJamesmie(text, ts) {
  if (!ts || ts <= _lastJamesmieTs) return;
  const jam = agents.jamesmie;
  if (jam.state === 'working' || jam.state === 'walking_to_desk') return;
  _lastJamesmieTs = ts;
  leaveAllQueues('jamesmie');
  jam._coffeeArrived = false;
  jam._sofaArrived = false;

  const truncated = text.length > 40 ? text.slice(0, 39) + '…' : text;
  jam.state = 'jamesmie_flow';
  jam._jMsg = truncated;
  jam._jPhase = 'walking_desk';
  jam._jTimer = 0;
  jam.targetPos = { ...SIT_POS.jamesmie };
  jam.speechText = '';
  jam.taskLabel = '';
  jam._idleInit = false;
}

let _lastWriterTs = 0;

function triggerWriter(text, ts) {
  if (!ts || ts <= _lastWriterTs) return;
  const w = agents.writer;
  if (w.state === 'working' || w.state === 'walking_to_desk' || w.state === 'writer_flow') return;
  _lastWriterTs = ts;
  leaveAllQueues('writer');
  w._coffeeArrived = false;
  w._sofaArrived = false;
  const truncated = text.length > 40 ? text.slice(0, 39) + '…' : text;
  w.state = 'writer_flow';
  w._wMsg = truncated;
  w._wPhase = 'walking_desk';
  w._wTimer = 0;
  w.targetPos = { ...SIT_POS.writer };
  w.speechText = '';
  w.taskLabel = '';
  w._idleInit = false;
}

// ============================================================
// EVENT POLLING
// ============================================================
function _activateAgent(agentKey, label, ts) {
  const ag = agents[agentKey];
  if (!ag || ts <= ag.lastEventTs) return;
  leaveAllQueues(agentKey);          // free any queue slot before working
  ag._coffeeArrived = false;
  ag._sofaArrived = false;
  ag.lastEventTs = ts;
  ag.taskLabel = label;
  ag.speechText = '';
  ag.speechTimer = 0;
  ag._idleInit = false;
  // Already at the desk (working or lingering)? Resume in place — no walk back.
  if (ag.state === 'working' || ag.state === 'desk_linger') {
    ag.state = 'working';
    ag._workTimer = 1800;
    ag.speechText = '💻';
    ag.speechTimer = 1800;
    return;
  }
  ag.state = 'walking_to_desk';
  const dest = SIT_POS[agentKey] || WORK_POS[agentKey];
  ag.targetPos = { x: dest.x, y: dest.y };
}

function _completeAgent(agentKey, ts) {
  const ag = agents[agentKey];
  if (!ag || ts <= ag.lastCompletedTs) return;
  ag.lastCompletedTs = ts;
  if (ag.state === 'working') {
    ag.state = 'done_flash';
    ag.taskLabel = '✅ Done';
    ag._doneTimer = 1200;
  } else if (ag.state === 'walking_to_desk') {
    ag._pendingComplete = true;
  }
}

let _lastProcessedTs = 0;
let _animQueue = [];
let _animBusy = false;

// Skip historical events on page load — only animate new ones
fetch('./agent-events.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    if (data.events && data.events.length > 0) {
      _lastProcessedTs = Math.max(...data.events.map(e => e.ts));
    }
  })
  .catch(() => {});

function _processAnimQueue() {
  if (_animBusy || _animQueue.length === 0) return;
  _animBusy = true;
  const ev = _animQueue.shift();
  _activateAgent(ev.agent, ev.label, ev.ts);
  setTimeout(() => { _animBusy = false; _processAnimQueue(); }, 2800);
}

async function fetchEvents() {
  try {
    const r = await fetch('./agent-events.json?_=' + Date.now());
    if (!r.ok) return;
    const data = await r.json();

    if (data.events) {
      const fresh = data.events.filter(e => e.ts > _lastProcessedTs);
      if (fresh.length > 0) {
        _lastProcessedTs = Math.max(...fresh.map(e => e.ts));
        _animQueue.push(...fresh);
        _processAnimQueue();
      }
    }
    if (data.user_message) {
      triggerJamesmie(data.user_message.text, data.user_message.timestamp);
    }
    if (data.assistant_response) {
      triggerWriter(data.assistant_response.text, data.assistant_response.timestamp);
    }
  } catch(e) { /* silently ignore */ }
}

setInterval(fetchEvents, 500);

function update(dt) {
  for (const ag of Object.values(agents)) {
    // Advance walk frame animation
    if (ag.state !== 'idle_chill' && ag.state !== 'idle_phone') {
      ag.frameTimer += dt;
      if (ag.frameTimer >= 150) {
        ag.frameTimer = 0;
        ag.frameIdx = (ag.frameIdx + 1) % 4;
      }
    }
    // Tick speech bubble timer
    if (ag.speechTimer > 0) {
      ag.speechTimer -= dt;
      if (ag.speechTimer <= 0) ag.speechText = '';
    }
    // Tick task label done-flash timer
    if (ag._doneTimer !== undefined && ag._doneTimer > 0) {
      ag._doneTimer -= dt;
      if (ag._doneTimer <= 0) {
        ag._doneTimer = 0;
        ag.taskLabel = '';
        ag.state = 'desk_linger';        // stay seated to avoid pacing back and forth
        ag._lingerTimer = DESK_LINGER_MS;
        ag.targetPos = null;
        ag.idleTimer = 0;
      }
    }
  }
  // ---- IDLE STATE MACHINE ----
  for (const ag of Object.values(agents)) {
    if (!ag.state.startsWith('idle')) continue;
    ag.idleTimer += dt;

    if (ag.state === 'idle_wander') {
      if (!ag.targetPos) {
        let px, py, attempts = 0;
        do {
          px = WALK.x + Math.random() * (WALK.maxX - WALK.x);
          py = WALK.y + Math.random() * (WALK.maxY - WALK.y);
          attempts++;
        } while (isInsideObstacle(px, py) && attempts < 20);
        ag.targetPos = { x: px, y: py };
        ag._waypoint = getWaypoint(ag.pos, ag.targetPos);
        ag.idleDuration = 3000 + Math.random() * 8000;
      }
      const arrived = moveToward(ag, ag.targetPos, dt);
      if (arrived || ag.idleTimer > ag.idleDuration) {
        ag.idleTimer = 0;
        ag.targetPos = null;
        ag.state = _pickIdleState();
      }
    }

    else if (ag.state === 'idle_phone') {
      if (!ag._idleInit) {
        ag._idleInit = true;
        ag.idleDuration = 4000 + Math.random() * 8000;
        ag.speechText = '📱';
        ag.speechTimer = ag.idleDuration;
      }
      if (ag.idleTimer > ag.idleDuration) {
        ag._idleInit = false;
        ag.idleTimer = 0;
        ag.state = _pickIdleState();
      }
    }

    else if (ag.state === 'idle_coffee') {
      if (!ag._idleInit) {
        ag._idleInit = true;
        ag.idleDuration = 5000 + Math.random() * 8000;
        const slot = joinQueue('coffee', _agentKey(ag));
        if (slot === -1) {              // queue full → do something else
          ag._idleInit = false;
          ag.idleTimer = 0;
          ag.targetPos = null;
          ag.state = 'idle_wander';
          continue;
        }
      }
      const spot = queueSlotPos('coffee', _agentKey(ag));
      if (spot) ag.targetPos = { x: spot.x, y: spot.y };
      const atSpot = moveToward(ag, ag.targetPos, dt);
      const atFront = queues.coffee.indexOf(_agentKey(ag)) === 0;
      if (atSpot && atFront && !ag._coffeeArrived) {
        ag._coffeeArrived = true;
        ag.speechText = '☕';
        ag.speechTimer = ag.idleDuration;
      }
      if (ag.idleTimer > ag.idleDuration) {
        leaveQueue('coffee', _agentKey(ag));
        ag._idleInit = false;
        ag._coffeeArrived = false;
        ag.idleTimer = 0;
        ag.targetPos = null;
        ag.state = _pickIdleState();
      }
    }

    else if (ag.state === 'idle_chill') {
      if (!ag._idleInit) {
        ag._idleInit = true;
        ag.idleDuration = 7000 + Math.random() * 10000;
        const slot = joinQueue('sofa', _agentKey(ag));
        if (slot === -1) {
          ag._idleInit = false;
          ag.idleTimer = 0;
          ag.targetPos = null;
          ag.state = 'idle_wander';
          continue;
        }
      }
      const spot = queueSlotPos('sofa', _agentKey(ag));
      if (spot) ag.targetPos = { x: spot.x, y: spot.y };
      const atSofa = moveToward(ag, ag.targetPos, dt);
      if (atSofa && !ag._sofaArrived) {
        ag._sofaArrived = true;
        ag.speechText = '😴';
        ag.speechTimer = ag.idleDuration;
      }
      if (ag.idleTimer > ag.idleDuration) {
        leaveQueue('sofa', _agentKey(ag));
        ag._idleInit = false;
        ag._sofaArrived = false;
        ag.idleTimer = 0;
        ag.targetPos = null;
        ag.state = _pickIdleState();
      }
    }

    else if (ag.state === 'idle_chat_walk') {
      const arrived = moveToward(ag, ag.targetPos, dt);
      if (arrived) {
        ag.state = 'idle_chat';
        ag.speechText = ag._chatPhrase;
        ag.speechTimer = 3500;
        ag.facingLeft = ag.pos.x > ag._chatMidX;
        ag.idleTimer = 0;
      }
    }
    else if (ag.state === 'idle_chat') {
      if (ag.speechTimer <= 0) {
        ag.state = 'idle_wander'; ag.targetPos = null;
        ag._chatPhrase = ''; ag.idleTimer = 0;
      }
    }
  }

  // ---- CHAT PROXIMITY CHECK (every 2s) ----
  _chatCheckTimer += dt;
  if (_chatCheckTimer > 2000) {
    _chatCheckTimer = 0;
    _checkChat();
  }
  // ---- ACTIVE TOOL STATES ----
  for (const ag of Object.values(agents)) {
    if (ag.state === 'walking_to_desk') {
      const arrived = moveToward(ag, ag.targetPos, dt);
      if (arrived) {
        ag._pendingComplete = false;
        ag.state = 'working';
        ag._workTimer = 1800;
        ag.speechText = '💻';
        ag.speechTimer = 1800;
      }
    }
    if (ag.state === 'working' && ag._workTimer > 0) {
      ag._workTimer -= dt;
      if (ag._workTimer <= 0) {
        ag.state = 'done_flash';
        ag.taskLabel = '✅ Done';
        ag._doneTimer = 1200;
      }
    }
    // 'done_flash' state: _doneTimer handled in the timer tick block above
    if (ag.state === 'desk_linger') {
      ag._lingerTimer -= dt;
      if (ag._lingerTimer <= 0) {
        ag.state = 'idle_wander';
        ag.targetPos = null;
        ag.idleTimer = 0;
      }
    }
  }
  // ---- JAMESMIE DELEGATION FLOW ----
  const jam = agents.jamesmie;
  if (jam.state === 'jamesmie_flow') {
    jam._jTimer += dt;

    if (jam._jPhase === 'walking_desk') {
      const arrived = moveToward(jam, SIT_POS.jamesmie, dt);
      if (arrived) {
        jam._jPhase = 'speaking';
        jam._jTimer = 0;
        jam._lastDY = 1;               // face down (seated)
        jam.speechText = jam._jMsg;    // your voice
        jam.speechTimer = 3000;
      }
    }
    else if (jam._jPhase === 'speaking') {
      if (jam._jTimer > 3000) {
        jam._jPhase = 'thinking';
        jam._jTimer = 0;
        jam._thinkDots = 0;
        jam.speechText = '💭';
      }
    }
    else if (jam._jPhase === 'thinking') {
      // animate dots: . .. ...
      jam._thinkDots = (jam._thinkDots || 0) + dt;
      const n = 1 + (Math.floor(jam._thinkDots / 400) % 3);
      jam.speechText = '💭' + '.'.repeat(n);
      jam.speechTimer = 500;
      if (jam._jTimer > 2000) {
        jam._jPhase = 'dispatch';
        jam._jTimer = 0;
        jam.taskLabel = '📋 สั่งงาน!';
        // face toward the team (dev room is to the right)
        jam.facingLeft = false;
      }
    }
    else if (jam._jPhase === 'dispatch') {
      if (jam._jTimer > 1500) {
        jam._jPhase = null;
        jam.taskLabel = '';
        jam.speechText = '';
        jam.state = 'working';   // settle into seated working pose
        jam._workTimer = 4000;
      }
    }
  }

  // ---- WRITER FLOW ----
  const wrt = agents.writer;
  if (wrt.state === 'writer_flow') {
    wrt._wTimer += dt;

    if (wrt._wPhase === 'walking_desk') {
      const arrived = moveToward(wrt, SIT_POS.writer, dt);
      if (arrived) {
        wrt._wPhase = 'typing';
        wrt._wTimer = 0;
        wrt._lastDY = 1;            // face down (seated)
        wrt.speechText = '✍️';
        wrt.speechTimer = 1500;
      }
    }
    else if (wrt._wPhase === 'typing') {
      if (wrt._wTimer > 1500) {
        wrt._wPhase = 'replying';
        wrt._wTimer = 0;
        wrt.speechText = wrt._wMsg;   // real reply text
        wrt.speechTimer = 3500;
      }
    }
    else if (wrt._wPhase === 'replying') {
      if (wrt._wTimer > 3500) {
        wrt._wPhase = null;
        wrt.speechText = '';
        wrt.state = 'desk_linger';       // linger at desk like the others
        wrt._lingerTimer = DESK_LINGER_MS;
        wrt.targetPos = null;
        wrt._idleInit = false;
        wrt.idleTimer = 0;
      }
    }
  }
}

function drawDeskFronts() {
  for (const [key, ag] of Object.entries(agents)) {
    const seated =
      ag.state === 'working' ||
      ag.state === 'desk_linger' ||
      (ag.state === 'writer_flow' && ag._wPhase && ag._wPhase !== 'walking_desk') ||
      (ag.state === 'jamesmie_flow' && ag._jPhase && ag._jPhase !== 'walking_desk');
    if (!seated) continue;
    const d = DESK_FRONTS[key];
    if (!d) continue;
    rect(d.x, d.y, d.w, d.h, d.color);
    rect(d.x, d.y, d.w, 3, 'rgba(255,255,255,0.08)');
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawAllRooms();
  drawAllFurniture();
  const sorted = Object.values(agents).sort((a, b) => a.pos.y - b.pos.y);
  for (const ag of sorted) drawAgent(ag);
  drawDeskFronts();
  drawHeader();
}

function loop(ts) {
  const dt = Math.min(ts - _lastTs, 100);
  _lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(ts => { _lastTs = ts; requestAnimationFrame(loop); });
</script>
