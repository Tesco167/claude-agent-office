<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ส. ขอนแก่น Office</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Leelawadee UI', 'Tahoma', sans-serif;
  }
  #office {
    max-width: 900px;
    width: 100%;
    image-rendering: pixelated;
    border: 2px solid #7c3aed;
    box-shadow: 0 0 40px rgba(124,58,237,0.4), 0 0 80px rgba(196,18,48,0.2);
  }
  #status {
    margin-top: 10px;
    color: #7c3aed;
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.7;
  }
</style>
</head>
<body>
<canvas id="office"></canvas>
<div id="status">● LIVE — ส. ขอนแก่น AI Office</div>
<script>
// ============================================================
// CONSTANTS
// ============================================================
const W = 900, H = 580;
const S = 3; // pixel art scale: 1 unit = S canvas px

const canvas = document.getElementById('office');
const ctx    = canvas.getContext('2d');

const DPR = window.devicePixelRatio || 1;
canvas.width  = W * DPR;
canvas.height = H * DPR;
canvas.style.width  = W + 'px';
canvas.style.height = H + 'px';
ctx.scale(DPR, DPR);

// ============================================================
// COLORS
// ============================================================
const C = {
  headerBg:     '#0d0d1a',
  wallOuter:    '#1a1a2e',
  wallHighlight:'#3d3d5c',
  bossFloor:    '#2a1f3d',
  devFloor:     '#1e2a2e',
  opsFloor:     '#1a2218',
  loungeFloor:  '#2e2415',
  deskWalnut:   '#3d2b1a',
  deskGaming:   '#2d2d4e',
  bookshelf:    '#2d1f0e',
  sofaBlue:     '#2d3561',
  sofaDark:     '#1e2449',
  coffeeM:      '#2d2d2d',
  rugWarm:      '#3d2a1a',
  plantDark:    '#1a3a1a',
  plantLight:   '#2d6b2d',
  serverRack:   '#1a1a2a',
  brand:        '#C41230',
  gold:         '#ffd700',
  amber:        '#d97706',
  purple:       '#7c3aed',
  skin:         '#f5d5a0',
  hair:         '#2d1b00',
  leg:          '#1a1a1a',
  shoe:         '#4a3520',
  white:        '#ffffff',
  crown:        '#ffd700',
  jamesGold:    '#fbbf24',
  readerBlue:   '#3b82f6',
  coderGreen:   '#22c55e',
  searchOrange: '#f97316',
};

// ============================================================
// ROOM LAYOUT
// ============================================================
const HEADER_H = 40;
const ROOM_W = 450;
const ROOM_H = 260;

const ROOMS = {
  boss:   { x: 0,      y: HEADER_H,           w: ROOM_W, h: ROOM_H, floor: C.bossFloor,   label: 'BOSS ROOM' },
  dev:    { x: ROOM_W, y: HEADER_H,           w: ROOM_W, h: ROOM_H, floor: C.devFloor,    label: 'DEV ROOM' },
  ops:    { x: 0,      y: HEADER_H + ROOM_H,  w: ROOM_W, h: ROOM_H, floor: C.opsFloor,    label: 'OPS ROOM' },
  lounge: { x: ROOM_W, y: HEADER_H + ROOM_H,  w: ROOM_W, h: ROOM_H, floor: C.loungeFloor, label: 'LOUNGE' },
};
const WALL = 8;
const DOOR_W = 28;

const WORK_POS = {
  jamesmie: { x: 120, y: 110 },
  reader:   { x: 555, y: 140 },
  coder:    { x: 720, y: 140 },
  searcher: { x: 110, y: 390 },
};
const IDLE_POS = {
  coffee: { x: 840, y: 340 },
  sofa:   { x: 585, y: 415 },
};
const CENTER_POS = { x: 450, y: 300 };
const WALK = { x: 15, y: 55, maxX: 885, maxY: 545 };

// ============================================================
// DRAW HELPERS
// ============================================================
function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function glow(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function drawText(str, x, y, opts = {}) {
  ctx.save();
  ctx.font = `${opts.weight || 'normal'} ${opts.size || 13}px ${"'Leelawadee UI','Tahoma',sans-serif"}`;
  ctx.fillStyle = opts.color || C.white;
  ctx.textAlign = opts.align || 'center';
  ctx.textBaseline = opts.baseline || 'middle';
  if (opts.shadow) {
    ctx.shadowColor = opts.shadow;
    ctx.shadowBlur = opts.shadowBlur || 8;
  }
  ctx.fillText(str, x, y);
  ctx.restore();
}



function drawSprite(grid, cx, cy, bodyColor, facingLeft = false, hairColor = null) {
  const colorMap = {
    's': C.skin, 'h': hairColor || C.hair, 'b': bodyColor,
    'l': C.leg,  'w': C.white, 'c': C.crown, 'e': '#2d1b00',
    'z': C.shoe,
  };
  const cols = grid[0].length;
  const rows = grid.length;
  const sprW = cols * S;

  ctx.save();
  if (facingLeft) {
    ctx.translate(cx + sprW, cy);
    ctx.scale(-1, 1);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const ch = grid[r][c];
        if (ch === '.') continue;
        ctx.fillStyle = colorMap[ch] || '#ff00ff';
        ctx.fillRect(c * S, r * S, S, S);
      }
    }
  } else {
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const ch = grid[r][c];
        if (ch === '.') continue;
        ctx.fillStyle = colorMap[ch] || '#ff00ff';
        ctx.fillRect(cx + c * S, cy + r * S, S, S);
      }
    }
  }
  ctx.restore();
}


// ============================================================
// AGENT OBJECTS
// ============================================================
const agents = {
  jamesmie: {
    name: 'Jamesmie', color: C.jamesGold,
    pos: { x: 100, y: 320 }, targetPos: null,
    speed: 85, state: 'idle_wander',
    frameIdx: 0, frameTimer: 0,
    idleTimer: 0, idleDuration: 5000 + Math.random() * 10000,
    facingLeft: false,
    taskLabel: '', speechText: '', speechTimer: 0,
    lastEventTs: 0, lastCompletedTs: 0,
  },
  reader: {
    name: 'Reader', color: C.readerBlue,
    pos: { x: 350, y: 300 }, targetPos: null,
    speed: 85, state: 'idle_wander',
    frameIdx: 0, frameTimer: 0,
    idleTimer: 0, idleDuration: 5000 + Math.random() * 10000,
    facingLeft: false,
    taskLabel: '', speechText: '', speechTimer: 0,
    lastEventTs: 0, lastCompletedTs: 0,
  },
  coder: {
    name: 'Coder', color: C.coderGreen,
    pos: { x: 500, y: 340 }, targetPos: null,
    speed: 85, state: 'idle_wander',
    frameIdx: 0, frameTimer: 0,
    idleTimer: 0, idleDuration: 5000 + Math.random() * 10000,
    facingLeft: false,
    taskLabel: '', speechText: '', speechTimer: 0,
    lastEventTs: 0, lastCompletedTs: 0,
  },
  searcher: {
    name: 'Searcher', color: C.searchOrange,
    pos: { x: 200, y: 380 }, targetPos: null,
    speed: 85, state: 'idle_wander',
    frameIdx: 0, frameTimer: 0,
    idleTimer: 0, idleDuration: 5000 + Math.random() * 10000,
    facingLeft: false,
    taskLabel: '', speechText: '', speechTimer: 0,
    lastEventTs: 0, lastCompletedTs: 0,
  },
};

// ============================================================
// MOVEMENT HELPERS
// ============================================================
function distTo(agent, target) {
  return Math.hypot(agent.pos.x - target.x, agent.pos.y - target.y);
}

function moveToward(agent, target, dt) {
  const dx = target.x - agent.pos.x;
  const dy = target.y - agent.pos.y;
  const d = Math.hypot(dx, dy);
  if (d < 2) return true; // arrived
  const step = agent.speed * dt / 1000;
  agent.pos.x += (dx / d) * Math.min(step, d);
  agent.pos.y += (dy / d) * Math.min(step, d);
  agent.facingLeft = dx < 0;
  return false;
}

// ============================================================
// BUBBLE DRAWING
// ============================================================
function drawBubble(agent, text_, isTask) {
  const bx = agent.pos.x;
  const by = agent.pos.y - 24 * S - 14;
  ctx.save();
  ctx.font = '12px "Leelawadee UI","Tahoma",sans-serif';
  const measured = ctx.measureText(text_).width;
  const tw = Math.min(measured + 16, 170);
  const th = 22;
  const bx0 = bx - tw / 2;
  const by0 = by - th / 2;

  // Bubble background
  ctx.fillStyle = isTask ? 'rgba(30,30,60,0.92)' : 'rgba(45,53,97,0.92)';
  ctx.strokeStyle = isTask ? C.amber : C.purple;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(bx0, by0, tw, th, 5);
  ctx.fill();
  ctx.stroke();

  // Tail
  ctx.beginPath();
  ctx.moveTo(bx - 5, by0 + th);
  ctx.lineTo(bx, by0 + th + 7);
  ctx.lineTo(bx + 5, by0 + th);
  ctx.closePath();
  ctx.fillStyle = isTask ? 'rgba(30,30,60,0.92)' : 'rgba(45,53,97,0.92)';
  ctx.fill();

  // Text
  ctx.fillStyle = C.white;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const display = text_.length > 22 ? text_.slice(0, 21) + '…' : text_;
  ctx.fillText(display, bx, by);
  ctx.restore();
}

// drawAgent — will be implemented in Task 2 (top-down sprites)
function drawAgent(agent) {
  // stub: filled in Task 2
  if (agent.taskLabel)  drawBubble(agent, agent.taskLabel, true);
  if (agent.speechText) drawBubble(agent, agent.speechText, false);
}

// ============================================================
// GAME LOOP
// ============================================================
let _lastTs = 0;
let _rgbPhase = 0;

// ============================================================
// IDLE STATE MACHINE HELPERS
// ============================================================
const CHAT_PHRASES = [
  'deploy แล้วหรือยัง?', 'วันนี้ busy มาก', 'กาแฟหมดแล้ว',
  'bug อีกแล้ว...', 'เดี๋ยว PR นะ', 'lunch กันไหม?',
  'review code ด้วยนะ', 'tests ผ่านแล้ว!',
];

function _pickIdleState() {
  const r = Math.random();
  if (r < 0.40) return 'idle_wander';
  if (r < 0.60) return 'idle_phone';
  if (r < 0.80) return 'idle_coffee';
  return 'idle_chill';
}

let _chatCheckTimer = 0;

function _checkChat() {
  const idleList = Object.values(agents).filter(ag =>
    ag !== agents.jamesmie && ag.state.startsWith('idle') && ag.state !== 'idle_chat'
  );
  for (let i = 0; i < idleList.length; i++) {
    for (let j = i + 1; j < idleList.length; j++) {
      const a = idleList[i], b = idleList[j];
      const dist = Math.hypot(a.pos.x - b.pos.x, a.pos.y - b.pos.y);
      if (dist < 80 && Math.random() < 0.30) {
        const phrase = CHAT_PHRASES[Math.floor(Math.random() * CHAT_PHRASES.length)];
        a.speechText = phrase;
        a.speechTimer = 3500;
        b.speechText = '😄';
        b.speechTimer = 3500;
        a.facingLeft = a.pos.x > b.pos.x;
        b.facingLeft = b.pos.x > a.pos.x;
      }
    }
  }
}

// ============================================================
// JAMESMIE TRIGGER FLOW
// ============================================================
let _lastJamesmieTs = 0;

function triggerJamesmie(text, ts) {
  if (!ts || ts <= _lastJamesmieTs) return;
  // Don't interrupt an active tool
  const jam = agents.jamesmie;
  if (jam.state === 'working' || jam.state === 'walking_to_desk') return;
  _lastJamesmieTs = ts;

  const truncated = text.length > 40 ? text.slice(0, 39) + '…' : text;
  jam.state = 'jamesmie_stand';
  jam._jMsg = truncated;
  jam._jPhase = 'walking_center';
  jam._jTimer = 0;
  jam.targetPos = { ...CENTER_POS };
  jam.speechText = '';
  jam._idleInit = false;
}

// ============================================================
// EVENT POLLING
// ============================================================
function _activateAgent(agentKey, label, ts) {
  const ag = agents[agentKey];
  if (!ag || ts <= ag.lastEventTs) return;
  ag.lastEventTs = ts;
  ag.taskLabel = label;
  ag.speechText = '';
  ag.speechTimer = 0;
  ag._idleInit = false;
  ag.state = 'walking_to_desk';
  ag.targetPos = { x: WORK_POS[agentKey].x, y: WORK_POS[agentKey].y };
}

function _completeAgent(agentKey, ts) {
  const ag = agents[agentKey];
  if (!ag || ts <= ag.lastCompletedTs) return;
  ag.lastCompletedTs = ts;
  if (ag.state === 'working' || ag.state === 'walking_to_desk') {
    ag.state = 'done_flash';
    ag.taskLabel = '✅ Done';
    ag._doneTimer = 1200;
  }
}

async function fetchEvents() {
  try {
    const r = await fetch('./agent-events.json?_=' + Date.now());
    if (!r.ok) return;
    const data = await r.json();

    if (data.current && data.current.status === 'active') {
      _activateAgent(data.current.agent, data.current.label, data.current.timestamp);
    }
    if (data.last_completed) {
      _completeAgent(data.last_completed.agent, data.last_completed.timestamp);
    }
    if (data.user_message) {
      triggerJamesmie(data.user_message.text, data.user_message.timestamp);
    }
  } catch(e) { /* silently ignore */ }
}

setInterval(fetchEvents, 500);

function update(dt) {
  _rgbPhase = (_rgbPhase + dt * 0.003) % (Math.PI * 6);

  for (const ag of Object.values(agents)) {
    // Advance walk frame animation
    if (ag.state !== 'idle_chill' && ag.state !== 'idle_phone') {
      ag.frameTimer += dt;
      if (ag.frameTimer >= 150) {
        ag.frameTimer = 0;
        ag.frameIdx = (ag.frameIdx + 1) % 4;
      }
    }
    // Tick speech bubble timer
    if (ag.speechTimer > 0) {
      ag.speechTimer -= dt;
      if (ag.speechTimer <= 0) ag.speechText = '';
    }
    // Tick task label done-flash timer
    if (ag._doneTimer !== undefined && ag._doneTimer > 0) {
      ag._doneTimer -= dt;
      if (ag._doneTimer <= 0) {
        ag._doneTimer = 0;
        ag.taskLabel = '';
        ag.state = 'idle_wander';
        ag.targetPos = null;
        ag.idleTimer = 0;
      }
    }
  }
  // ---- IDLE STATE MACHINE ----
  for (const ag of Object.values(agents)) {
    if (!ag.state.startsWith('idle')) continue;
    ag.idleTimer += dt;

    if (ag.state === 'idle_wander') {
      if (!ag.targetPos) {
        ag.targetPos = {
          x: WALK.x + Math.random() * (WALK.maxX - WALK.x),
          y: WALK.y + Math.random() * (WALK.maxY - WALK.y),
        };
        ag.idleDuration = 3000 + Math.random() * 8000;
      }
      const arrived = moveToward(ag, ag.targetPos, dt);
      if (arrived || ag.idleTimer > ag.idleDuration) {
        ag.idleTimer = 0;
        ag.targetPos = null;
        ag.state = _pickIdleState();
      }
    }

    else if (ag.state === 'idle_phone') {
      if (!ag._idleInit) {
        ag._idleInit = true;
        ag.idleDuration = 4000 + Math.random() * 8000;
        ag.speechText = '📱';
        ag.speechTimer = ag.idleDuration;
      }
      if (ag.idleTimer > ag.idleDuration) {
        ag._idleInit = false;
        ag.idleTimer = 0;
        ag.state = _pickIdleState();
      }
    }

    else if (ag.state === 'idle_coffee') {
      if (!ag._idleInit) {
        ag._idleInit = true;
        ag.idleDuration = 5000 + Math.random() * 8000;
      }
      if (!ag.targetPos) {
        ag.targetPos = { x: IDLE_POS.coffee.x, y: IDLE_POS.coffee.y };
      }
      const atCoffee = moveToward(ag, ag.targetPos, dt);
      if (atCoffee) {
        if (!ag._coffeeArrived) {
          ag._coffeeArrived = true;
          ag.speechText = '☕';
          ag.speechTimer = ag.idleDuration;
        }
        if (ag.idleTimer > ag.idleDuration) {
          ag._idleInit = false;
          ag._coffeeArrived = false;
          ag.idleTimer = 0;
          ag.targetPos = null;
          ag.state = _pickIdleState();
        }
      }
    }

    else if (ag.state === 'idle_chill') {
      if (!ag._idleInit) {
        ag._idleInit = true;
        ag.idleDuration = 7000 + Math.random() * 10000;
      }
      if (!ag.targetPos) {
        ag.targetPos = { x: IDLE_POS.sofa.x, y: IDLE_POS.sofa.y };
      }
      const atSofa = moveToward(ag, ag.targetPos, dt);
      if (atSofa) {
        if (!ag._sofaArrived) {
          ag._sofaArrived = true;
          ag.speechText = '😴';
          ag.speechTimer = ag.idleDuration;
        }
        if (ag.idleTimer > ag.idleDuration) {
          ag._idleInit = false;
          ag._sofaArrived = false;
          ag.idleTimer = 0;
          ag.targetPos = null;
          ag.state = _pickIdleState();
        }
      }
    }
  }

  // ---- CHAT PROXIMITY CHECK (every 2s) ----
  _chatCheckTimer += dt;
  if (_chatCheckTimer > 2000) {
    _chatCheckTimer = 0;
    _checkChat();
  }
  // ---- ACTIVE TOOL STATES ----
  for (const ag of Object.values(agents)) {
    if (ag.state === 'walking_to_desk') {
      const arrived = moveToward(ag, ag.targetPos, dt);
      if (arrived) {
        ag.state = 'working';
      }
    }
    // 'working' state: task bubble pulses — no extra logic needed here
    // 'done_flash' state: _doneTimer handled in the timer tick block above
  }
  // ---- JAMESMIE ACTIVE FLOW ----
  const jam = agents.jamesmie;
  if (jam.state === 'jamesmie_stand') {
    jam._jTimer += dt;

    if (jam._jPhase === 'walking_center') {
      const arrived = moveToward(jam, CENTER_POS, dt);
      if (arrived) {
        jam._jPhase = 'speaking';
        jam._jTimer = 0;
        jam.speechText = jam._jMsg;
        jam.speechTimer = 3200;
        // Other agents face Jamesmie
        for (const ag of Object.values(agents)) {
          if (ag !== jam && ag.state.startsWith('idle')) {
            ag.facingLeft = ag.pos.x > CENTER_POS.x;
          }
        }
      }
    }

    if (jam._jPhase === 'speaking' && jam._jTimer > 3500) {
      jam._jPhase = 'returning';
      jam._jTimer = 0;
      jam.targetPos = { ...WORK_POS.jamesmie };
    }

    if (jam._jPhase === 'returning') {
      const home = moveToward(jam, WORK_POS.jamesmie, dt);
      if (home) {
        jam.state = 'idle_wander';
        jam.targetPos = null;
        jam._jPhase = null;
        jam._jMsg = '';
        jam._idleInit = false;
        jam.idleTimer = 0;
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
}

function loop(ts) {
  const dt = Math.min(ts - _lastTs, 100);
  _lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(ts => { _lastTs = ts; requestAnimationFrame(loop); });
</script>
</body>
</html>
